<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Encuesta · Liga de parejas de pádel</title>
  <meta name="description" content="Encuesta para la liga de parejas en las noches de semana.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="cabecera">
    <div class="contenedor">
      <p class="marca"><span class="pelota" aria-hidden="true"></span> Club de pádel · 4 canchas techadas</p>
      <h1 id="titulo">Liga de parejas</h1>
      <p id="bajada" class="bajada"></p>
    </div>
  </header>

  <main class="contenedor">
    <div id="avisos-globales"></div>

    <section id="vista-formulario" aria-labelledby="titulo-formulario" hidden>
      <h2 id="titulo-formulario" class="visualmente-oculto">Encuesta</h2>
      <div id="aviso-formulario"></div>
      <form id="formulario" novalidate></form>
    </section>

    <section id="vista-resumen" aria-labelledby="titulo-resumen" hidden></section>
  </main>

  <footer class="pie">
    <div class="contenedor">
      <div id="zona-restablecer"></div>
      <p class="nota-pie">Las respuestas se guardan solo en este navegador (localStorage).</p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="src/config.js"></script>
  <script src="src/logic.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
